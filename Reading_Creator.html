<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Reading Creator</title>
<style>
  :root {
    --bg: #01b4b;
    --card: #ffffff;
    --primary: #0ea5e9;
    --primary-dark: #0284c7;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HOME */
  .home {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  .home-header {
    text-align: center;
    margin-bottom: 28px;
    margin-top: 20px;
  }
  .home-header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #0f172a;
  }
  .home-header p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
    line-height: 1.5;
    max-width: 340px;
    margin-left: auto;
    margin-right: auto;
  }
  .big-create {
    width: min(320px, 90vw);
    height: 64px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #0ea5e9, #6366f1);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(14,165,233,.35);
    margin: 12px auto 28px;
    display: block;
  }
  .big-create:active { transform: scale(0.98); }

  .form-card {
    width: min(520px, 100%);
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,.06);
    display: none;
  }
  .form-card.show { display: block; }
  .form-card label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 10px 0 6px;
    font-weight: 600;
  }
  .form-card input, .form-card textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    background: #f8fafc;
  }
  .form-card textarea {
    min-height: 220px;
    resize: vertical;
    line-height: 1.5;
  }
  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .btn-main {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    background: var(--primary);
    color: #fff;
  }
  .btn-main:disabled {
    opacity: 0.7;
    cursor: wait;
  }
  .btn-ghost {
    border: none;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    cursor: pointer;
    background: #e2e8f0;
    color: #334155;
  }
  .status {
    margin-top: 12px;
    font-size: 13px;
    color: var(--primary-dark);
    text-align: center;
    min-height: 18px;
  }

  .list-wrap {
    width: min(520px, 100%);
    margin-top: 22px;
  }
  .list-wrap h3 {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .card .title { font-weight: 600; font-size: 15px; flex: 1; }
  .card .meta { font-size: 12px; color: var(--muted); }
  .del {
    border: none;
    background: #fee2e2;
    color: #b91c1c;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  /* READER */
  .reader {
    display: none;
    flex-direction: column;
    height: 100vh;
  }
  .reader.active { display: flex; }
  .topbar {
    background: #1e3a5f;
    color: #fff;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .back {
    border: none;
    background: rgba(255,255,255,.15);
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
  }
  .top-title {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .split {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel {
    flex: 1 1 50%;
    overflow: auto;
    padding: 16px;
    line-height: 1.75;
    font-size: 16px;
    -webkit-user-select: text;
    user-select: text;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .panel-en { background: #fff; }
  .panel-bn { background: #f0fdf4; border-top: 1px solid #bbf7d0; }
  .divider {
    height: 8px;
    background: #cbd5e1;
    cursor: row-resize;
    flex-shrink: 0;
  }

  /* popup */
  .word-popup {
    position: fixed;
    z-index: 1000;
    background: #1e293b;
    color: #f1f5f9;
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
    max-width: 300px;
    display: none;
  }
  .word-popup.show { display: block; }
  .wp-word { font-weight: 700; color: #38bdf8; margin-bottom: 4px; }
  .wp-pron { font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
  .wp-mean { font-size: 14px; margin-bottom: 8px; }
  .wp-actions { display: flex; gap: 8px; }
  .wp-actions button {
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    background: #334155;
    color: #fff;
  }
  .wp-actions .speak { background: #0ea5e9; }
</style>
</head>
<body>

<div class="home" id="home">
  <div class="home-header">
    <h1>Reading Creator</h1>
    <p>ইংরেজি রিডিংয়ে উচ্চারণ ও অর্থ না বুঝলে পড়তে সমস্যা হয় — তাদের জন্য।</p>
    <p>যেকোনো শব্দ সিলেক্ট করলেই উচ্চারণ শোনা যাবে এবং বাংলা অর্থ দেখাবে।</p>
    <p>শুধু ইংরেজি প্যাসেজ দিন, বাংলা অনুবাদ নিজে তৈরি হয়ে যাবে।</p>
  </div>

  <button class="big-create" id="bigCreateBtn" onclick="openForm()">＋ Create</button>

  <div class="form-card" id="formCard">
    <label>প্যাসেজের নাম (ঐচ্ছিক)</label>
    <input type="text" id="cTitle" placeholder="নাম না দিলেও হবে">
    <label>ইংরেজি প্যাসেজ *</label>
    <textarea id="cEnglish" placeholder="এখানে পুরো ইংরেজি প্যাসেজ লিখুন বা পেস্ট করুন..."></textarea>
    <div class="form-actions">
      <button class="btn-main" id="createBtn" onclick="createPassage()">Create</button>
      <button class="btn-ghost" onclick="closeForm()">বাতিল</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="list-wrap" id="listWrap">
    <h3 id="listTitle" style="display:none;">আমার প্যাসেজ</h3>
    <div id="list"></div>
  </div>
</div>

<div class="reader" id="reader">
  <div class="topbar">
    <button class="back" onclick="showHome()">←</button>
    <div class="top-title" id="readerTitle">Passage</div>
  </div>
  <div class="split" id="split">
    <div class="panel panel-en" id="englishText"></div>
    <div class="divider" id="divider"></div>
    <div class="panel panel-bn" id="bengaliText"></div>
  </div>
</div>

<div class="word-popup" id="wordPopup">
  <div class="wp-word" id="wpWord"></div>
  <div class="wp-pron" id="wpPron"></div>
  <div class="wp-mean" id="wpMean"></div>
  <div class="wp-actions">
    <button class="speak" onclick="speakWord()">🔊 শুনুন</button>
    <button onclick="hideWordPopup()">✕</button>
  </div>
</div>

<script>
const STORE_KEY = 'reading_creator_passages_v1';
let current = null;
let currentSpeakText = '';
const meaningCache = {};
const pronCache = {};

function loadList() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }
  catch(e) { return []; }
}
function saveList(list) {
  localStorage.setItem(STORE_KEY, JSON.stringify(list));
}

function openForm() {
  var card = document.getElementById('formCard');
  var btn = document.getElementById('bigCreateBtn');
  if (card) card.classList.add('show');
  if (btn) btn.style.display = 'none';
  var st = document.getElementById('status');
  if (st) st.textContent = '';
  var ta = document.getElementById('cEnglish');
  if (ta) setTimeout(function(){ ta.focus(); }, 100);
}
function closeForm() {
  document.getElementById('formCard').classList.remove('show');
  document.getElementById('bigCreateBtn').style.display = 'block';
  document.getElementById('status').textContent = '';
}

function renderList() {
  const list = loadList();
  const el = document.getElementById('list');
  const title = document.getElementById('listTitle');
  el.innerHTML = '';
  title.style.display = list.length ? 'block' : 'none';
  list.forEach(p => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<div style="flex:1"><div class="title">${escapeHtml(p.title)}</div>
      <div class="meta">${(p.english||'').length} অক্ষর · বাংলা অনুবাদ আছে</div></div>
      <button class="del" onclick="deletePassage('${p.id}', event)">ডিলিট</button>`;
    div.onclick = function(e) {
      if (e.target.classList.contains('del')) return;
      openPassage(p.id);
    };
    el.appendChild(div);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function deletePassage(id, ev) {
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  if (!confirm('ডিলিট করবেন?')) return;
  saveList(loadList().filter(x => x.id !== id));
  renderList();
}

function looksLikeBengali(text) {
  if (!text) return false;
  const bn = (text.match(/[\u0980-\u09FF]/g) || []).length;
  const latin = (text.match(/[A-Za-z]/g) || []).length;
  // treat as Bengali if more Bengali chars than Latin, or at least some Bengali and not mostly Latin
  if (bn === 0) return false;
  return bn >= latin * 0.4 || (bn > 10 && bn > latin);
}

async function translateChunkGoogle(q) {
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=' + encodeURIComponent(q);
  const res = await fetch(url);
  if (!res.ok) throw new Error('google http ' + res.status);
  const data = await res.json();
  // data[0] is array of [translated, original, ...]
  if (!Array.isArray(data) || !Array.isArray(data[0])) return '';
  return data[0].map(function(row){ return row && row[0] ? row[0] : ''; }).join('');
}

async function translateChunkMyMemory(q) {
  const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) + '&langpair=en|bn';
  const res = await fetch(url);
  if (!res.ok) throw new Error('mymemory http ' + res.status);
  const data = await res.json();
  let t = (data && data.responseData && data.responseData.translatedText) || '';
  if (t.includes('MYMEMORY WARNING') || t.includes('QUERY LENGTH LIMIT')) t = '';
  return t;
}

async function translateOneChunk(q) {
  // Prefer Google (more reliable for bn), fallback MyMemory, then retries
  const attempts = [
    function(){ return translateChunkGoogle(q); },
    function(){ return translateChunkGoogle(q.slice(0, 450)); },
    function(){ return translateChunkMyMemory(q.slice(0, 400)); },
    function(){ return translateChunkMyMemory(q.slice(0, 250)); }
  ];
  for (let a = 0; a < attempts.length; a++) {
    try {
      if (a > 0) await sleep(400 + a * 200);
      let t = await attempts[a]();
      t = (t || '').trim();
      if (t && looksLikeBengali(t)) return t;
      // sometimes API returns same English — treat as fail
      if (t && t.toLowerCase() === q.toLowerCase()) continue;
      if (t && looksLikeBengali(t)) return t;
    } catch (e) {}
  }
  return '';
}

async function translateToBengali(english, onProgress) {
  let raw = (english || '').replace(/\r\n/g, '\n').trim();
  let paragraphs = raw.split(/\n\s*\n/).map(function(p){
    return p.replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim();
  }).filter(Boolean);
  if (paragraphs.length === 1 && raw.includes('\n')) {
    paragraphs = raw.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
  }

  // smaller chunks = fewer API failures
  const allChunks = [];
  paragraphs.forEach(function(para, pi) {
    const parts = para.split(/(?<=[.!?])\s+/);
    let buf = '';
    for (let pi2 = 0; pi2 < parts.length; pi2++) {
      const part = parts[pi2];
      if ((buf + ' ' + part).length > 280 && buf) {
        allChunks.push({ text: buf.trim(), paraIndex: pi });
        buf = part;
      } else {
        buf = buf ? buf + ' ' + part : part;
      }
    }
    if (buf.trim()) allChunks.push({ text: buf.trim(), paraIndex: pi });
  });

  const paraOut = paragraphs.map(function(){ return []; });
  let failCount = 0;
  for (let i = 0; i < allChunks.length; i++) {
    if (onProgress) onProgress(i + 1, allChunks.length);
    const q = allChunks[i].text;
    const pi = allChunks[i].paraIndex;
    let translated = await translateOneChunk(q);
    if (!translated || !looksLikeBengali(translated)) {
      failCount++;
      // last resort: wait and try Google once more with shorter text
      await sleep(700);
      try {
        translated = await translateChunkGoogle(q.slice(0, 220));
      } catch (e) { translated = ''; }
      if (!looksLikeBengali(translated)) {
        translated = ''; // do not keep English in Bengali panel silently
        failCount++;
      }
    }
    // if still empty, mark clearly so user knows
    paraOut[pi].push(translated || ('[অনুবাদ হয়নি] ' + q));
    await sleep(350);
  }

  const result = paraOut.map(function(parts){ return parts.join(' '); }).join('\n\n');
  // if almost everything failed, throw so createPassage can show error
  const bnChars = (result.match(/[\u0980-\u09FF]/g) || []).length;
  if (bnChars < 30) {
    throw new Error('translation_failed');
  }
  return result;
}

function normalizeEnglishParagraphs(english) {
  let raw = (english || '').replace(/\r\n/g, '\n').trim();
  let paragraphs = raw.split(/\n\s*\n/).map(p => p.replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  if (paragraphs.length === 1 && raw.includes('\n')) {
    paragraphs = raw.split('\n').map(l => l.trim()).filter(Boolean);
  }
  return paragraphs.join('\n\n');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function createPassage() {
  const titleInput = (document.getElementById('cTitle').value || '').trim();
  const english = (document.getElementById('cEnglish').value || '').trim();
  if (!english || english.length < 10) {
    alert('ইংরেজি প্যাসেজ লিখুন');
    return;
  }
  const btn = document.getElementById('createBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = 'অনুবাদ শুরু হচ্ছে... ইন্টারনেট চালু রাখুন';

  try {
    const bengali = await translateToBengali(english, function(cur, total) {
      status.textContent = 'বাংলায় অনুবাদ হচ্ছে... (' + cur + '/' + total + ')';
    });
    const id = 'p-' + Date.now();
    const title = titleInput || ('Passage ' + new Date().toLocaleString('en-GB'));
    const englishNorm = normalizeEnglishParagraphs(english);
    const item = { id, title, english: englishNorm, bengali, created: Date.now() };
    const list = loadList();
    list.unshift(item);
    saveList(list);
    document.getElementById('cTitle').value = '';
    document.getElementById('cEnglish').value = '';
    closeForm();
    renderList();
    openPassage(id);
  } catch (e) {
    console.error(e);
    if (String(e && e.message).indexOf('translation_failed') >= 0) {
      status.textContent = 'অনুবাদ হয়নি। ইন্টারনেট চালু আছে কিনা দেখুন, তারপর আবার Create চাপুন।';
    } else {
      status.textContent = 'অনুবাদ ব্যর্থ বা আংশিক হয়েছে। ইন্টারনেট চালু রেখে আবার Create চাপুন।';
    }
  } finally {
    btn.disabled = false;
  }
}

function openPassage(id) {
  const p = loadList().find(x => x.id === id);
  if (!p) return;
  current = p;
  document.getElementById('home').style.display = 'none';
  document.getElementById('reader').classList.add('active');
  document.getElementById('readerTitle').textContent = p.title;
  document.getElementById('englishText').textContent = p.english || '';
  document.getElementById('bengaliText').textContent = p.bengali || '';
  document.getElementById('englishText').scrollTop = 0;
  document.getElementById('bengaliText').scrollTop = 0;
}

function showHome() {
  document.getElementById('reader').classList.remove('active');
  document.getElementById('home').style.display = 'flex';
  current = null;
  hideWordPopup();
  try { speechSynthesis.cancel(); } catch(e) {}
  renderList();
}

/* Word popup */
function hideWordPopup() {
  document.getElementById('wordPopup').classList.remove('show');
  currentSpeakText = '';
}
function speakWord() {
  if (!currentSpeakText) return;
  try { speechSynthesis.cancel(); } catch(e) {}
  const u = new SpeechSynthesisUtterance(currentSpeakText);
  u.lang = 'en-US';
  u.rate = 0.92;
  speechSynthesis.speak(u);
}

async function fetchMeaning(word) {
  const key = word.toLowerCase();
  if (meaningCache[key]) return meaningCache[key];
  try {
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=en|bn';
    const res = await fetch(url);
    const data = await res.json();
    let mean = (data && data.responseData && data.responseData.translatedText) || '';
    if (mean.includes('MYMEMORY WARNING')) mean = '';
    if (mean.toLowerCase() === key) mean = '';
    meaningCache[key] = mean || 'অর্থ পাওয়া যায়নি';
  } catch(e) {
    meaningCache[key] = 'ইন্টারনেট লাগবে';
  }
  return meaningCache[key];
}

// Bengali pronunciation for English words
const BN_PRON = {
  the:"দ্যা",a:"এ",an:"অ্যান",of:"অভ",to:"টু",and:"অ্যান্ড",in:"ইন",is:"ইজ",for:"ফর",
  you:"ইউ",that:"দ্যাট",it:"ইট",on:"অন",with:"উইথ",as:"অ্যাজ",be:"বি",this:"দিস",
  have:"হ্যাভ",from:"ফ্রম",or:"অর",one:"ওয়ান",had:"হ্যাড",by:"বাই",not:"নট",but:"বাট",
  what:"হোয়াট",all:"অল",were:"ওয়ার",when:"হোয়েন",we:"উই",there:"দেয়ার",can:"ক্যান",
  their:"দেয়ার",said:"সেড",each:"ইচ",which:"হুইচ",she:"শি",do:"ডু",how:"হাউ",if:"ইফ",
  will:"উইল",up:"আপ",other:"আদার",about:"অ্যাবাউট",out:"আউট",many:"মেনি",then:"দেন",
  them:"দেম",these:"দিজ",so:"সো",some:"সাম",her:"হার",would:"উড",make:"মেক",like:"লাইক",
  him:"হিম",into:"ইন্টু",time:"টাইম",has:"হ্যাজ",look:"লুক",two:"টু",more:"মোর",write:"রাইট",
  go:"গো",see:"সি",number:"নাম্বার",no:"নো",way:"ওয়ে",could:"কুড",people:"পিপল",my:"মাই",
  than:"দ্যান",first:"ফার্স্ট",water:"ওয়াটার",been:"বিন",call:"কল",who:"হু",oil:"অয়েল",

function approxPron(w) {
  if (!w) return '';
  const key = w.toLowerCase().replace(/[^a-z']/g, '');
  if (BN_PRON[key]) return BN_PRON[key];

  // phonetic fallback (never return English word as-is)
  let s = key;
  const rules = [
    [/tion/g,'শন'],[/sion/g,'ঝন'],[/cious/g,'শাস'],[/tious/g,'শাস'],
    [/ough/g,'অফ'],[/augh/g,'াফ'],[/igh/g,'াই'],[/ure/g,'ইউর'],
    [/ph/g,'ফ'],[/ch/g,'চ'],[/sh/g,'শ'],[/th/g,'থ'],[/wh/g,'হু'],
    [/ck/g,'ক'],[/ng/g,'ং'],[/qu/g,'ক্ব'],
    [/scr/g,'স্ক্র'],[/str/g,'স্ট্র'],[/spr/g,'স্প্র'],[/sk/g,'স্ক'],[/st/g,'স্ট'],[/sp/g,'স্প'],
    [/ee/g,'ি'],[/ea/g,'ি'],[/oo/g,'ু'],[/ou/g,'াউ'],[/ow/g,'ো'],
    [/ai/g,'েই'],[/ay/g,'েই'],[/oi/g,'য়'],[/oy/g,'য়'],
    [/ar/g,'ার'],[/er/g,'ার'],[/ir/g,'ার'],[/or/g,'র'],[/ur/g,'ার'],
    [/a/g,'া'],[/e/g,'ে'],[/i/g,'ি'],[/o/g,'ো'],[/u/g,'ু'],
    [/b/g,'ব'],[/c/g,'ক'],[/d/g,'ড'],[/f/g,'ফ'],[/g/g,'গ'],[/h/g,'হ'],
    [/j/g,'জ'],[/k/g,'ক'],[/l/g,'ল'],[/m/g,'ম'],[/n/g,'ন'],[/p/g,'প'],
    [/r/g,'র'],[/s/g,'স'],[/t/g,'ট'],[/v/g,'ভ'],[/w/g,'ও'],[/x/g,'ক্স'],
    [/y/g,'ি'],[/z/g,'জ']
  ];
  for (const [re, rep] of rules) s = s.replace(re, rep);
  s = s.replace(/[^\u0980-\u09FF]/g, '');
  return s || key;
}

let selTimer = null;
function onSelect() {
  clearTimeout(selTimer);
  selTimer = setTimeout(handleSel, 120);
  setTimeout(handleSel, 280);
}

async function handleSel() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;
  const text = sel.toString().trim().replace(/\s+/g, ' ');
  if (!text || text.length < 2 || text.length > 300) return;
  const words = text.split(/\s+/);
  const isWord = words.length === 1;
  let x = innerWidth/2, y = innerHeight/3;
  try {
    const r = sel.getRangeAt(0).getBoundingClientRect();
    x = r.left + r.width/2;
    y = r.bottom;
  } catch(e) {}

  currentSpeakText = text;
  const popup = document.getElementById('wordPopup');
  document.getElementById('wpWord').textContent = text.length > 50 ? text.slice(0,47)+'...' : text;
  document.getElementById('wpPron').textContent = isWord ? ('উচ্চারণ: ' + approxPron(words[0])) : '';
  document.getElementById('wpMean').textContent = 'অর্থ লোড হচ্ছে...';
  popup.style.left = Math.max(8, Math.min(innerWidth-280, x-100)) + 'px';
  popup.style.top = Math.min(innerHeight-140, y+8) + 'px';
  popup.classList.add('show');

  const mean = await fetchMeaning(text);
  document.getElementById('wpMean').textContent = mean;
  try { speakWord(); } catch(e) {}
}

['englishText','bengaliText'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('mouseup', onSelect);
  el.addEventListener('touchend', function(){ setTimeout(onSelect, 30); setTimeout(onSelect, 200); });
});
document.addEventListener('selectionchange', function() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;
  const n = sel.anchorNode && (sel.anchorNode.nodeType===3 ? sel.anchorNode.parentElement : sel.anchorNode);
  if (n && n.closest && (n.closest('#englishText') || n.closest('#bengaliText'))) {
    setTimeout(onSelect, 80);
  }
});
document.addEventListener('touchstart', function(e) {
  const p = document.getElementById('wordPopup');
  if (p.classList.contains('show') && !p.contains(e.target)) {
    hideWordPopup();
    try { getSelection().removeAllRanges(); } catch(err) {}
  }
}, {passive:true});
document.addEventListener('mousedown', function(e) {
  const p = document.getElementById('wordPopup');
  if (p.classList.contains('show') && !p.contains(e.target)) hideWordPopup();
});

  let startY=0, enH=0;
  function start(e){
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    startY = y; enH = en.getBoundingClientRect().height;
    e.preventDefault();
  }
  function move(e){
    if (!startY) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const dy = y - startY;
    const total = en.parentElement.getBoundingClientRect().height - 8;
    let nh = Math.max(80, Math.min(total-80, enH + dy));
    en.style.flex = '0 0 ' + nh + 'px';
    bn.style.flex = '1 1 auto';
  }
  function end(){ startY = 0; }
  div.addEventListener('mousedown', start);
  div.addEventListener('touchstart', start, {passive:false});
  window.addEventListener('mousemove', move);
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('mouseup', end);
  window.addEventListener('touchend', end);
})();

renderList();
</script>
</body>
</html>
